<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #0ff;
    }

    #chat-box {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #222;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 1rem;
      font-size: 1rem;
      padding: 0.5rem;
      border: 1px solid #555;
      background-color: #111;
      color: #eee;
    }

    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: #0ff;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .response {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #1a1a1a;
      border: 1px solid #444;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Gemini Chat Interface</h1>

  <div id="chat-box">
    <label for="message">Your Message:</label>
    <textarea id="message" placeholder="Type your message here..."></textarea>
    <button id="sendBtn">Send</button>
    <div class="response" id="responseBox"></div>
  </div>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('message');
    const responseBox = document.getElementById('responseBox');

    sendBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) {
        alert("Please enter a message.");
        return;
      }

      sendBtn.disabled = true;
      responseBox.textContent = "Thinking...";

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message })
        });

        const text = await res.text();

        try {
          const json = JSON.parse(text);
          if (json.success) {
            responseBox.textContent = json.response;
          } else {
            responseBox.textContent = "Error: " + (json.error || "Unknown error");
          }
        } catch (err) {
          responseBox.textContent = "Failed to parse response: " + text;
        }

      } catch (err) {
        responseBox.textContent = "Request failed: " + err.message;
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
